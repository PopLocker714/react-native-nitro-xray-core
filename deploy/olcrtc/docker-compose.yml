# olcrtc SERVER — the exit side of the WebRTC side-channel.
#
# The mobile app runs the olcrtc CLIENT natively (XrayClient.startOlcrtc); this
# container is the SERVER it pairs with. carrier + transport + room + key MUST
# match on both sides (manual.md: "должны совпадать с сервером").
#
# PULL-ONLY: this pulls a prebuilt image so the deploy server never compiles.
# Build + push the image from a dev box first (see README / Dockerfile):
#   docker build -t <you>/olcrtc:latest deploy/olcrtc
#   docker push  <you>/olcrtc:latest
# then set OLCRTC_IMAGE in .env. The image is built from CANONICAL olcrtc pinned
# to the client's commit, so client and server share the protocol.
#
# First `srv` run auto-generates the 64-hex encryption key, persists it to the
# volume, and prints `OLCRTC_KEY=...` to the logs. Copy that key into the mobile
# client config (OlcrtcClientConfig.keyHex).

services:
  olcrtc-server:
    # Pulls the prebuilt image; override with OLCRTC_IMAGE if you retag.
    image: "${OLCRTC_IMAGE:-jojo714/olcrtc:latest}"
    container_name: olcrtc-server
    restart: unless-stopped
    environment:
      OLCRTC_MODE: srv
      # jitsi | telemost | wbstream. jitsi+datachannel is the fastest, most
      # stable combo (fast.ru.md) — the default here.
      OLCRTC_CARRIER: "${OLCRTC_CARRIER:-jitsi}"
      # MUST equal the mobile client's transport. NOTE the native client
      # defaults to vp8channel, so pass transport:'datachannel' in startOlcrtc.
      OLCRTC_TRANSPORT: "${OLCRTC_TRANSPORT:-datachannel}"
      # For jitsi, room = the FULL meeting URL (e.g. https://meet.jit.si/myroom).
      OLCRTC_ROOM_ID: "${OLCRTC_ROOM_ID:?set OLCRTC_ROOM_ID (jitsi meeting URL) in .env}"
      # Leave empty to auto-generate on first run (saved to the volume, logged).
      OLCRTC_KEY: "${OLCRTC_KEY:-}"
      OLCRTC_KEY_FILE: /var/lib/olcrtc/key.hex
      OLCRTC_DNS: "${OLCRTC_DNS:-8.8.8.8:53}"
      OLCRTC_DEBUG: "${OLCRTC_DEBUG:-false}"
    volumes:
      # Persists the generated key across restarts.
      - olcrtc-state:/var/lib/olcrtc
    init: true

volumes:
  olcrtc-state:
