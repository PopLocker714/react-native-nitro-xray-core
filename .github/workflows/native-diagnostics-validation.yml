name: Native diagnostics validation

on:
  push:
    branches: [feat/native-diagnostics-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - run: bun install --frozen-lockfile
      - name: Generate bindings, check types and tests
        run: |
          bun ./node_modules/.bin/nitrogen
          bun run typecheck
          bun test
      - name: Collector race tests
        working-directory: go-core
        run: go test -race -tags diagnosticstest ./libxray
      - name: System replay policy tests
        run: |
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" android/src/main/java/com/nitroxraycore/SystemReplayPolicy.kt android/tests/SystemReplayPolicyTest.kt -include-runtime -d "$RUNNER_TEMP/replay-policy.jar"
          java -jar "$RUNNER_TEMP/replay-policy.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-bindings
          path: nitrogen/generated
          retention-days: 7

  android-go:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
            compiler: aarch64-linux-android24
          - abi: armeabi-v7a
            arch: arm
            compiler: armv7a-linux-androideabi24
          - abi: x86_64
            arch: amd64
            compiler: x86_64-linux-android24
          - abi: x86
            arch: '386'
            compiler: i686-linux-android24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;29.0.14206865'
      - name: Build matching Go library and header
        working-directory: go-core
        env:
          ABI: ${{ matrix.abi }}
          GOARCH: ${{ matrix.arch }}
          COMPILER: ${{ matrix.compiler }}
          GOOS: android
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
        run: |
          export CC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/$COMPILER-clang"
          if [ "$GOARCH" = arm ]; then export GOARM=7; fi
          mkdir -p "../android/src/main/jniLibs/$ABI" "../android/src/main/cpp/xray/$ABI"
          go build -p 2 -trimpath -buildmode=c-shared -ldflags='-s -w -checklinkname=0 -extldflags=-Wl,-soname,libxray.so' -o "../android/src/main/jniLibs/$ABI/libxray.so" ./libxray
          mv "../android/src/main/jniLibs/$ABI/libxray.h" "../android/src/main/cpp/xray/$ABI/libxray.h"
          python3 -c 'import os,subprocess; tool=os.environ["ANDROID_HOME"]+"/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"; data=subprocess.check_output([tool,"-D","../android/src/main/jniLibs/"+os.environ["ABI"]+"/libxray.so"],text=True); symbols={line.split()[-1] for line in data.splitlines() if line.split()}; required={"GetDiagnosticSnapshot","GetDiagnosticCheckpoint","BeginDiagnosticAttempt","RecordDiagnosticCode","ClearDiagnostics"}; missing=required-symbols; assert not missing,sorted(missing); print("All diagnostic C exports present")'
      - uses: actions/upload-artifact@v4
        with:
          name: native-go-android-${{ matrix.abi }}
          path: |
            android/src/main/jniLibs/${{ matrix.abi }}/libxray.so
            android/src/main/cpp/xray/${{ matrix.abi }}/libxray.h
          retention-days: 7

  android-example:
    needs: [contracts, android-go]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-bindings
          path: nitrogen/generated
      - uses: actions/download-artifact@v4
        with:
          pattern: native-go-android-*
          merge-multiple: true
          path: android/src/main
      - run: bun install --frozen-lockfile
      - name: Compile JNI, generated bindings and Kotlin consumer
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

  ios-go:
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - name: Build matching iOS device and simulator archives
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: bash go-core/build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-go-ios
          path: ios/Xray.xcframework
          retention-days: 7

  ios-example:
    needs: [contracts, ios-go]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-bindings
          path: nitrogen/generated
      - uses: actions/download-artifact@v4
        with:
          name: native-go-ios
          path: ios/Xray.xcframework
      - run: bun install --frozen-lockfile
      - name: Resolve native dependencies
        working-directory: example/ios
        run: pod install
      - name: Compile Swift, generated bindings and extension
        working-directory: example/ios
        run: |
          xcodebuild -workspace NitroXrayCoreExample.xcworkspace -scheme NitroXrayCoreExample -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/diagnostics-ios-build" build CODE_SIGNING_ALLOWED=NO
